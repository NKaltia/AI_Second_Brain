<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Second Brain</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <div class="left-sidebar glass-panel">
            <div class="sidebar-header">
                <h2>Notes🗓️</h2>
                <button id="add-note-btn" class="add-note-btn" title="Create New Note">+</button>
            </div>
            <div id="notes-list" class="notes-list-container">
                <!-- temp -->
            </div>
        </div>

        <div class="chat-area glass-panel">
            <div class="chat-header">
                <h2>AI Assistant</h2>
                <button id="logout-btn" class="logout-btn" title="Log out">Log out</button>
            </div>
            <div id="chat-history" class="chat-history-container">
            </div>
            <div class="input-area">
                <textarea id="user-input" placeholder="Ask me anything..." rows="1" spellcheck="false"></textarea>
                <button id="ask-btn" class="send-btn" title="Ask AI">
                    <svg class="ask-icon ask-icon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14"></path>
                        <path d="M13 6l6 6-6 6"></path>
                    </svg>
                    <svg class="ask-icon ask-icon-spinner" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" opacity="0.25"></circle>
                        <path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div id="note-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <div class="modal-header">
                <input type="text" id="modal-title" class="modal-input" placeholder="Title">
            </div>
            <textarea id="modal-textarea" class="modal-input" placeholder="Your note content..."></textarea>
            <div id="modal-tags-container" class="tags-container">
                <button id="add-tag-btn" class="add-tag-btn" title="Add Tag">+</button>
            </div>
            <div id="tag-dropdown" class="tag-dropdown hidden">
                <input type="text" id="new-tag-input" placeholder="New tag name" autocomplete="off" maxlength="20">
                <div class="predefined-tags">
                    <span class="dropdown-tag">work</span>
                    <span class="dropdown-tag">study</span>
                    <span class="dropdown-tag">ideas</span>
                    <span class="dropdown-tag">food</span>
                    <span class="dropdown-tag">travel</span>
                    <span class="dropdown-tag">leisure</span>
                    <span class="dropdown-tag">ToDo</span>
                </div>
            </div>
            <p id="note-form-error" class="form-error hidden" role="alert"></p>
            <div class="modal-actions">
                <button id="modal-close-btn" class="glass-btn">Cancel</button>
                <button id="modal-save-btn" class="glass-btn" style="background: rgba(46,204,113,0.4)">Save</button>
            </div>
        </div>
    </div>
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel confirm-modal-content">
            <h3>Are you sure?</h3>
            <p>Do you really want to delete this note?</p>
            <div class="modal-actions">
                <button id="confirm-cancel-btn" class="glass-btn">Cancel</button>
                <button id="confirm-ok-btn" class="glass-btn ok-btn">Delete</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <!-- Decorative S-curve wash (pink → violet → blue); not interactive -->
        <svg class="auth-wave" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="auth-wave-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#f472b6"></stop>
                    <stop offset="48%" stop-color="#c084fc"></stop>
                    <stop offset="100%" stop-color="#60a5fa"></stop>
                </linearGradient>
            </defs>
            <path fill="url(#auth-wave-grad)" opacity="0.85"
                d="M-5,78 C18,92 28,48 48,58 C68,68 78,22 105,32 L105,58 C82,48 72,88 52,78 C32,68 20,108 -5,95 Z"></path>
        </svg>
        <div class="modal-content glass-panel auth-modal-content">
            <h2 id="auth-title">Login</h2>

            <input type="email" id="auth-email" class="modal-input auth-input" placeholder="email">
            <input type="password" id="auth-password" class="modal-input auth-input" placeholder="password">
            <input type="password" id="auth-confirm-password" class="modal-input auth-input hidden"
                placeholder="confirm password">

            <p id="auth-form-error" class="form-error hidden" role="alert"></p>

            <div class="modal-actions auth-actions">
                <button id="auth-action-btn" class="glass-btn auth-submit-btn">Log in</button>
                <button id="auth-switch-btn" class="glass-btn auth-switch-btn">Register</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script src="api.js"></script>
    <script src="script.js"></script>
</body>

</html>
